[project]
name = "caspyan"
version = "0.1.0"
description = "A lightweight CAS mock server for test scenarios"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "starlette>=1.3.1,<2",
    "uvicorn[standard]>=0.52.1,<1",
    "jinja2>=3.1,<4",
    "itsdangerous>=2.2,<3",
    "python-multipart>=0.0.12",
]

[project.scripts]
caspyan = "caspyan.main:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
